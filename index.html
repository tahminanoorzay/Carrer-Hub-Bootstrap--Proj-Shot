<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Carrer-Hub Bootstrap Proj Shot</title>
  </head>
  <body>
    <div class="container text-center mt-5">
      <span class="badge bg-primary p-2 px-3">CAREER OPPORTUNITY</span>
      <h1 class="fw-bold mt-3">Join Our Team</h1>
      <p class="text-secondary fs-5">
        Apply for your dream job and become part of our growing team.
      </p>
    </div>

    <form action="">
      <div class="container mt-5 card p-4 shadow">
        <!-- Personal Information Section -->
        <div class="container border-bottom border-1 border-secondary pb-3">
          <h4 class="fw-bold text-primary">01. Personal Information</h4>
          <div class="row mt-3">
            <div class="col-md-6 mb-3">
              <label for="fullName" class="form-label">First Name</label>
              <input
                type="text"
                class="form-control"
                placeholder="Enter first name"
                id="fullName"
              />
            </div>
            <div class="col-md-6 mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input
                type="text"
                class="form-control"
                placeholder="Enter last name"
                id="lastName"
              />
            </div>
            <div class="col-md-6 mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text">@</span>
                <input
                  type="email"
                  class="form-control"
                  placeholder="Enter your email"
                  id="email"
                />
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input
                type="tel"
                class="form-control"
                placeholder="+1 234 567 890"
                id="phone"
              />
            </div>
            <div class="col-md-12 mb-3">
              <label for="address" class="form-label"
                >Residential Address</label
              >
              <input
                type="text"
                class="form-control"
                placeholder="Enter your complete address"
                id="address"
              />
            </div>
          </div>
        </div>

        <!-- Job Details Section -->
        <div class="container border-bottom border-1 border-secondary py-4">
          <h4 class="fw-bold text-primary">02. Job Details</h4>
          <div class="row mt-3">
            <div class="col-md-6 mb-3">
              <label for="position" class="form-label"
                >Position Applying For</label
              >
              <select name="" id="position" class="form-select">
                <option value="" selected disabled>Select a position</option>
                <option value="front-end" class="form-control">
                  FrontEnd Devaloper
                </option>
                <option value="back-end" class="form-control">
                  BackEnd Devaloper
                </option>
                <option value="ui/ux-disin" class="form-control">
                  Ul/UX Designer
                </option>
                <option value="digitle-markite" class="form-control">
                  Digitle Markiting
                </option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="experience" class="form-label"
                >Years of Experience</label
              >
              <select name="" class="form-control" id="experience">
                <option value="" selected disabled>Select Experience</option>
                <option value="fresh-graduate" class="form-control">
                  Fresh Graduate
                </option>
                <option value="1-2-year" class="form-control">
                  1 - 2 years
                </option>
                <option value="3-5-year" class="form-control">
                  3 - 5 years
                </option>
                <option value="5-year" class="form-control">5+ years</option>
              </select>
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Employment Type</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input
                  type="radio"
                  class="form-check-input"
                  id="full-time"
                  name="employment-type"
                  value="full-time"
                />
                <label class="form-check-label" for="full-time">
                  Full-Time
                </label>
              </div>

              <div class="form-check">
                <input
                  type="radio"
                  class="form-check-input"
                  id="part-time"
                  name="employment-type"
                  value="part-time"
                />
                <label class="form-check-label" for="part-time">
                  Part-Time
                </label>
              </div>

              <div class="form-check">
                <input
                  type="radio"
                  class="form-check-input"
                  id="remote"
                  name="employment-type"
                  value="remote"
                />
                <label class="form-check-label" for="remote"> Remote </label>
              </div>
            </div>
          </div>
          <div class="col-12 mb-3">
            <label for="salary" class="form-label"
              >Expected Monthly Salary</label
            >
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input
                type="number"
                class="form-control"
                placeholder="e.g. 2500"
                id="salary"
              />
              <span class="input-group-text">USD</span>
            </div>
            <p class="form-text">Enter your expected salary in US dollars.</p>
          </div>
        </div>
      </div>
    </form>
  </body>
</html>
